<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">Czym jest ExcelForge?</title>
  <desc id="desc">Minimalistyczna grafika ExcelForge: problem, proces ExcelForge i rozwiązanie.</desc>
  <defs>
    <linearGradient id="softBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F8F4"/>
    </linearGradient>
    <style>
      .ink{fill:#0D2B1F}
      .green{fill:#0E6B3A}
      .line{stroke:#0E6B3A;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .grid{stroke:#0E6B3A;stroke-width:1.4;opacity:.12}
      .label{font-family:Arial,Helvetica,sans-serif;font-weight:700;letter-spacing:5px;fill:#0D2B1F}
      .body{font-family:Arial,Helvetica,sans-serif;fill:#0D2B1F}
    </style>
  </defs>

  <rect width="1080" height="1080" fill="url(#softBg)"/>

  <!-- subtle technical grid -->
  <g class="grid">
    <path d="M760 0v1080M910 0v1080M0 620h1080M0 800h1080"/>
    <path d="M760 80h300M760 220h300M760 360h300M760 500h300"/>
  </g>
  <g fill="#4CBE5B" opacity=".35">
    <rect x="755" y="75" width="10" height="10"/><rect x="905" y="215" width="10" height="10"/>
    <rect x="905" y="495" width="10" height="10"/><rect x="755" y="795" width="10" height="10"/>
  </g>

  <!-- canonical EF Block -->
  <g transform="translate(72 58) scale(.56)">
    <rect x="12" y="12" width="112" height="112" rx="18" fill="#7DCB65"/>
    <rect x="132" y="12" width="112" height="112" rx="18" fill="#4CBE5B"/>
    <rect x="12" y="132" width="112" height="112" rx="18" fill="#26913F"/>
    <rect x="132" y="132" width="112" height="112" rx="18" fill="#0E6B3A"/>
    <g fill="#0D2B1F">
      <rect x="43" y="34" width="14" height="68"/><rect x="43" y="34" width="50" height="14"/><rect x="43" y="61" width="42" height="13"/><rect x="43" y="88" width="50" height="14"/>
      <rect x="163" y="34" width="14" height="68"/><rect x="163" y="34" width="50" height="14"/><rect x="163" y="61" width="42" height="13"/>
    </g>
    <g fill="#FFFFFF">
      <rect x="43" y="154" width="14" height="68"/><rect x="43" y="154" width="50" height="14"/><rect x="43" y="181" width="42" height="13"/><rect x="43" y="208" width="50" height="14"/>
      <rect x="163" y="154" width="14" height="68"/><rect x="163" y="154" width="50" height="14"/><rect x="163" y="181" width="42" height="13"/>
    </g>
  </g>

  <text x="235" y="125" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="800" class="ink">Excel<tspan fill="#0E6B3A">Forge</tspan></text>
  <text x="238" y="172" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="9" class="ink">EXCEL / AI / AUTOMATYZACJA</text>
  <rect x="238" y="205" width="92" height="6" rx="3" fill="#0E6B3A"/>

  <text x="72" y="380" font-family="Arial,Helvetica,sans-serif" font-size="108" font-weight="900" fill="#0B1A21">Czym jest</text>
  <text x="72" y="500" font-family="Arial,Helvetica,sans-serif" font-size="108" font-weight="900" fill="#0E6B3A">ExcelForge?</text>

  <!-- problem card -->
  <g transform="translate(72 610)">
    <rect width="250" height="245" rx="18" fill="#FFFFFF" opacity=".78"/>
    <g transform="translate(70 38)">
      <path d="M18 0h82v98H18z" fill="none" stroke="#87939A" stroke-width="6" rx="5"/>
      <path d="M40 28h38M40 50h38M40 72h28" stroke="#87939A" stroke-width="6" stroke-linecap="round"/>
      <path d="M100 68l35 60H65z" fill="#FFFFFF" stroke="#0B1A21" stroke-width="6" stroke-linejoin="round"/>
      <path d="M100 88v18M100 116v1" stroke="#0B1A21" stroke-width="6" stroke-linecap="round"/>
    </g>
    <text x="125" y="215" text-anchor="middle" font-size="22" class="label">PROBLEM</text>
  </g>

  <!-- central outline EF Block -->
  <g transform="translate(420 626)">
    <path d="M-28 0h28M-28 0v28M228 0h28M256 0v28M-28 222h28M-28 194v28M228 222h28M256 194v28" class="line"/>
    <g transform="translate(20 20)">
      <rect x="0" y="0" width="82" height="82" rx="13" fill="none" stroke="#7DCB65" stroke-width="6"/>
      <rect x="92" y="0" width="82" height="82" rx="13" fill="none" stroke="#4CBE5B" stroke-width="6"/>
      <rect x="0" y="92" width="82" height="82" rx="13" fill="none" stroke="#26913F" stroke-width="6"/>
      <rect x="92" y="92" width="82" height="82" rx="13" fill="none" stroke="#0E6B3A" stroke-width="6"/>
      <text x="41" y="58" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="900" fill="#0D2B1F">E</text>
      <text x="133" y="58" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="900" fill="#0D2B1F">F</text>
      <text x="41" y="150" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="900" fill="#0E6B3A">E</text>
      <text x="133" y="150" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="900" fill="#0E6B3A">F</text>
    </g>
  </g>

  <!-- solution card -->
  <g transform="translate(760 610)">
    <rect width="250" height="245" rx="18" fill="#FFFFFF" opacity=".78"/>
    <g transform="translate(62 38)">
      <path d="M18 0h82v98H18z" fill="none" stroke="#0E6B3A" stroke-width="6"/>
      <path d="M40 28h38M40 50h38M40 72h28" stroke="#0E6B3A" stroke-width="6" stroke-linecap="round"/>
      <circle cx="105" cy="98" r="42" fill="#FFFFFF" stroke="#0E6B3A" stroke-width="6"/>
      <path d="M84 98l14 14 27-31" fill="none" stroke="#0E6B3A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="125" y="215" text-anchor="middle" font-size="22" class="label">ROZWIĄZANIE</text>
  </g>

  <!-- arrows -->
  <path d="M340 730h58m-20-18 20 18-20 18M690 730h52m-20-18 20 18-20 18" class="line"/>

  <text x="95" y="975" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="800" fill="#0B1A21">Praktycznie.</text>
  <rect x="358" y="935" width="4" height="48" rx="2" fill="#0E6B3A"/>
  <text x="405" y="975" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="800" fill="#0B1A21">Świadomie.</text>
  <rect x="704" y="935" width="4" height="48" rx="2" fill="#0E6B3A"/>
  <text x="752" y="975" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="800" fill="#0B1A21">Bez skrótów.</text>
</svg>