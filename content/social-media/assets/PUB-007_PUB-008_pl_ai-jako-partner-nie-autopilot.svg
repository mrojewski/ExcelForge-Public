<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">AI jako partner, nie autopilot</title>
  <desc id="desc">Grafika ExcelForge: użytkownik i AI współpracują wokół analizy, a decyzja pozostaje po stronie użytkownika.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBFDFC"/>
      <stop offset="0.54" stop-color="#F4F8F4"/>
      <stop offset="1" stop-color="#EDF7EF"/>
    </linearGradient>
    <linearGradient id="center" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2F5E5"/>
      <stop offset="1" stop-color="#C9E9D0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0D2B1F" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#background)"/>
  <path d="M-80 864C102 764 164 960 347 878S596 792 711 880s256 126 449-36V1080H-80Z" fill="#DDF4E2" opacity=".63"/>
  <path d="M820 -30C760 152 900 160 1080 60V-30Z" fill="#E1F6E7"/>

  <!-- PCB traces, deliberately subtle so the reading order stays mobile-first. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 402H66V374H126" stroke="#A8DAB3" stroke-width="3" opacity=".72"/>
    <path d="M954 346H1010V318H1080" stroke="#A8DAB3" stroke-width="3" opacity=".72"/>
    <path d="M0 856H58V889H145" stroke="#B8DCC0" stroke-width="3" opacity=".72"/>
    <path d="M891 885H972V919H1080" stroke="#B8DCC0" stroke-width="3" opacity=".72"/>
    <path d="M115 463V434H175" stroke="#C0DCCE" stroke-width="2"/>
    <path d="M965 476V438H905" stroke="#C0DCCE" stroke-width="2"/>
  </g>
  <g fill="#79C888" opacity=".78">
    <circle cx="66" cy="402" r="6"/><circle cx="126" cy="374" r="6"/>
    <circle cx="1010" cy="346" r="6"/><circle cx="954" cy="346" r="6"/>
    <circle cx="58" cy="856" r="6"/><circle cx="145" cy="889" r="6"/>
    <circle cx="972" cy="885" r="6"/><circle cx="891" cy="885" r="6"/>
  </g>

  <!-- Canonical ExcelForge horizontal lockup, copied unchanged from mrojewski/ExcelForge main. -->
  <g transform="translate(72 54) scale(.46)">
    <g transform="translate(16 16) scale(0.5)">
      <rect x="12" y="12" width="112" height="112" rx="18" fill="#7DCB65"/>
      <rect x="132" y="12" width="112" height="112" rx="18" fill="#4CBE5B"/>
      <rect x="12" y="132" width="112" height="112" rx="18" fill="#26913F"/>
      <rect x="132" y="132" width="112" height="112" rx="18" fill="#0E6B3A"/>
      <g fill="#0D2B1F"><rect x="43" y="34" width="14" height="68"/><rect x="43" y="34" width="50" height="14"/><rect x="43" y="61" width="42" height="13"/><rect x="43" y="88" width="50" height="14"/><rect x="163" y="34" width="14" height="68"/><rect x="163" y="34" width="50" height="14"/><rect x="163" y="61" width="42" height="13"/></g>
      <g fill="#FFFFFF"><rect x="43" y="154" width="14" height="68"/><rect x="43" y="154" width="50" height="14"/><rect x="43" y="181" width="42" height="13"/><rect x="43" y="208" width="50" height="14"/><rect x="163" y="154" width="14" height="68"/><rect x="163" y="154" width="50" height="14"/><rect x="163" y="181" width="42" height="13"/></g>
    </g>
    <text x="170" y="102" fill="#0D2B1F" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="-2">ExcelForge</text>
  </g>

  <text x="540" y="218" text-anchor="middle" fill="#0D2B1F" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="-2">AI jako partner, nie autopilot</text>
  <text x="540" y="278" text-anchor="middle" fill="#557165" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600">AI wspiera analizę. Użytkownik podejmuje decyzję.</text>
  <path d="M340 322H740" stroke="#BCDCC4" stroke-width="2"/>

  <!-- UŻYTKOWNIK -->
  <g filter="url(#shadow)">
    <rect x="72" y="395" width="310" height="368" rx="28" fill="#FFFFFF" stroke="#C9E4D0" stroke-width="2"/>
    <rect x="72" y="395" width="310" height="76" rx="28" fill="#EFF8F0"/>
    <rect x="72" y="443" width="310" height="28" fill="#EFF8F0"/>
  </g>
  <text x="227" y="442" text-anchor="middle" fill="#0D2B1F" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="2">UŻYTKOWNIK</text>
  <circle cx="227" cy="557" r="51" fill="#DFF3E3"/>
  <circle cx="227" cy="542" r="18" fill="none" stroke="#0E6B3A" stroke-width="8"/>
  <path d="M189 608C197 574 257 574 265 608" fill="none" stroke="#0E6B3A" stroke-width="8" stroke-linecap="round"/>
  <path d="M130 660H324" stroke="#D6E9D9" stroke-width="2"/>

  <!-- central ANALIZA / DECYZJA zone -->
  <g filter="url(#shadow)">
    <rect x="410" y="364" width="260" height="430" rx="32" fill="url(#center)" stroke="#8BCB98" stroke-width="2"/>
  </g>
  <text x="540" y="421" text-anchor="middle" fill="#0E6B3A" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="2">ANALIZA</text>
  <g fill="none" stroke="#0E6B3A" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="520" cy="513" r="38" stroke-width="7"/>
    <path d="M547 540L573 566" stroke-width="8"/>
    <path d="M499 515L516 497L529 510L545 487" stroke-width="6"/>
  </g>
  <path d="M456 604H624" stroke="#A6D6B0" stroke-width="2"/>
  <text x="540" y="653" text-anchor="middle" fill="#0E6B3A" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="2">DECYZJA</text>
  <circle cx="540" cy="709" r="37" fill="#0E6B3A"/>
  <path d="M521 709L534 722L560 694" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- AI -->
  <g filter="url(#shadow)">
    <rect x="698" y="395" width="310" height="368" rx="28" fill="#FFFFFF" stroke="#C9E4D0" stroke-width="2"/>
    <rect x="698" y="395" width="310" height="76" rx="28" fill="#EFF8F0"/>
    <rect x="698" y="443" width="310" height="28" fill="#EFF8F0"/>
  </g>
  <text x="853" y="442" text-anchor="middle" fill="#0D2B1F" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="2">AI</text>
  <rect x="796" y="504" width="114" height="106" rx="22" fill="#DFF3E3" stroke="#0E6B3A" stroke-width="7"/>
  <path d="M828 504V484M853 504V477M878 504V484M828 610V630M853 610V637M878 610V630M796 536H776M796 560H769M796 584H776M910 536H930M910 560H937M910 584H930" stroke="#0E6B3A" stroke-width="6" stroke-linecap="round"/>
  <circle cx="830" cy="551" r="7" fill="#0E6B3A"/><circle cx="876" cy="551" r="7" fill="#0E6B3A"/>
  <path d="M830 582H876" stroke="#0E6B3A" stroke-width="7" stroke-linecap="round"/>
  <path d="M756 660H950" stroke="#D6E9D9" stroke-width="2"/>

  <!-- connectors between the three zones -->
  <g fill="none" stroke="#26913F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M382 575H398"/><path d="M385 564L398 575L385 586"/>
    <path d="M670 575H686"/><path d="M683 564L696 575L683 586"/>
  </g>

  <path d="M72 915H1008" stroke="#BCDCC4" stroke-width="2"/>
</svg>
