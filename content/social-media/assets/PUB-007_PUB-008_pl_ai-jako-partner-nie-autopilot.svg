<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">AI jako partner, nie autopilot</title>
  <desc id="desc">Grafika ExcelForge pokazująca równorzędne moduły Użytkownik i AI, połączone wspólną strefą Analiza i Decyzja.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F8F4"/>
    </linearGradient>
    <linearGradient id="userHead" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0F8F1"/>
      <stop offset="1" stop-color="#E2F2E5"/>
    </linearGradient>
    <linearGradient id="aiHead" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDF7F2"/>
      <stop offset="1" stop-color="#DFF0E8"/>
    </linearGradient>
    <linearGradient id="shared" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DDF2E4"/>
      <stop offset="1" stop-color="#C9E8D3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#0D2B1F" flood-opacity=".10"/>
    </filter>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .ink { fill: #0D2B1F; }
      .muted { fill: #456554; }
      .label { font-family: Arial, Helvetica, sans-serif; fill: #0E6B3A; font-size: 17px; font-weight: 700; letter-spacing: 1.6px; }
      .section-title { font-family: Arial, Helvetica, sans-serif; fill: #0D2B1F; font-size: 18px; font-weight: 700; letter-spacing: .5px; }
      .section-body { font-family: Arial, Helvetica, sans-serif; fill: #456554; font-size: 18px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <path d="M0 920C173 827 242 1010 420 936C641 844 828 1012 1080 891V1080H0Z" fill="#E5F2E7" opacity=".72"/>
  <path d="M892 0C910 94 1004 109 1080 76V0Z" fill="#E7F5EA"/>

  <!-- Subtle PCB traces provide one shared information flow across both modules. -->
  <g fill="none" stroke="#79B98A" stroke-linecap="round" stroke-linejoin="round" opacity=".48">
    <path d="M0 423H36V452H92V523H156" stroke-width="3"/>
    <path d="M0 672H58V640H132V608H194" stroke-width="3"/>
    <path d="M0 802H86V833H184" stroke-width="3"/>
    <path d="M924 505H986V473H1080" stroke-width="3"/>
    <path d="M888 664H958V696H1080" stroke-width="3"/>
    <path d="M910 817H1005V849H1080" stroke-width="3"/>
    <path d="M298 367V342H420V372H660V342H782V367" stroke-width="3"/>
    <path d="M298 875V900H420V870H660V900H782V875" stroke-width="3"/>
  </g>
  <g fill="#63AD75" opacity=".58">
    <circle cx="36" cy="423" r="5"/><circle cx="92" cy="452" r="5"/><circle cx="58" cy="672" r="5"/><circle cx="86" cy="802" r="5"/>
    <circle cx="986" cy="473" r="5"/><circle cx="958" cy="664" r="5"/><circle cx="1005" cy="817" r="5"/>
    <circle cx="420" cy="342" r="5"/><circle cx="660" cy="342" r="5"/><circle cx="420" cy="900" r="5"/><circle cx="660" cy="900" r="5"/>
  </g>

  <!-- Canonical ef-lockup-horizontal.svg from mrojewski/ExcelForge main, commit 41c6b61. -->
  <svg x="628" y="42" width="384" height="96" viewBox="0 0 640 160" role="img" aria-labelledby="lockup-title lockup-desc">
    <title id="lockup-title">ExcelForge horizontal lockup</title>
    <desc id="lockup-desc">EF Block symbol followed by the ExcelForge wordmark.</desc>
    <g transform="translate(16 16) scale(0.5)">
      <rect x="12" y="12" width="112" height="112" rx="18" fill="#7DCB65"/>
      <rect x="132" y="12" width="112" height="112" rx="18" fill="#4CBE5B"/>
      <rect x="12" y="132" width="112" height="112" rx="18" fill="#26913F"/>
      <rect x="132" y="132" width="112" height="112" rx="18" fill="#0E6B3A"/>
      <g fill="#0D2B1F">
        <rect x="43" y="34" width="14" height="68"/><rect x="43" y="34" width="50" height="14"/><rect x="43" y="61" width="42" height="13"/><rect x="43" y="88" width="50" height="14"/>
        <rect x="163" y="34" width="14" height="68"/><rect x="163" y="34" width="50" height="14"/><rect x="163" y="61" width="42" height="13"/>
      </g>
      <g fill="#FFFFFF">
        <rect x="43" y="154" width="14" height="68"/><rect x="43" y="154" width="50" height="14"/><rect x="43" y="181" width="42" height="13"/><rect x="43" y="208" width="50" height="14"/>
        <rect x="163" y="154" width="14" height="68"/><rect x="163" y="154" width="50" height="14"/><rect x="163" y="181" width="42" height="13"/>
      </g>
    </g>
    <text x="170" y="102" fill="#0D2B1F" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="-2">ExcelForge</text>
  </svg>

  <text x="540" y="193" text-anchor="middle" class="sans ink" font-size="62" font-weight="700" letter-spacing="-1.8">AI jako partner,</text>
  <text x="540" y="261" text-anchor="middle" class="sans ink" font-size="62" font-weight="700" letter-spacing="-1.8">nie autopilot</text>
  <text x="540" y="312" text-anchor="middle" class="sans muted" font-size="28" font-weight="600">AI wspiera analizę. Użytkownik podejmuje decyzję.</text>
  <path d="M235 347H845" stroke="#B8D6C0" stroke-width="2"/>

  <!-- Equal-size modules: neither UŻYTKOWNIK nor AI is visually subordinate. -->
  <g filter="url(#shadow)">
    <rect x="54" y="390" width="344" height="488" rx="28" fill="#FFFFFF" stroke="#C8E0CE" stroke-width="2"/>
    <path d="M54 418A28 28 0 0 1 82 390H370A28 28 0 0 1 398 418V468H54Z" fill="url(#userHead)"/>
    <rect x="682" y="390" width="344" height="488" rx="28" fill="#FFFFFF" stroke="#C8E0CE" stroke-width="2"/>
    <path d="M682 418A28 28 0 0 1 710 390H998A28 28 0 0 1 1026 418V468H682Z" fill="url(#aiHead)"/>
  </g>

  <g fill="none" stroke="#7EBA8C" stroke-linecap="round" stroke-linejoin="round" opacity=".33">
    <path d="M72 520H118V542H172V518H244" stroke-width="3"/>
    <path d="M73 666H130V642H196V669H292" stroke-width="3"/>
    <path d="M190 824V798H276V822H376" stroke-width="3"/>
    <path d="M700 520H754V542H820V518H906" stroke-width="3"/>
    <path d="M702 666H764V642H840V669H935" stroke-width="3"/>
    <path d="M717 824H800V798H874V822H1008" stroke-width="3"/>
  </g>

  <text x="226" y="439" text-anchor="middle" class="sans ink" font-size="27" font-weight="700" letter-spacing="2">UŻYTKOWNIK</text>
  <g fill="none" stroke="#0E6B3A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="92" cy="429" r="13"/><path d="M70 454C75 434 109 434 114 454"/>
  </g>
  <text x="854" y="439" text-anchor="middle" class="sans ink" font-size="27" font-weight="700" letter-spacing="2">AI</text>
  <g fill="none" stroke="#0E6B3A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="962" y="415" width="27" height="27" rx="6"/><path d="M969 415V408M982 415V408M969 442V449M982 442V449M962 422H955M989 422H996M962 435H955M989 435H996"/>
    <circle cx="971" cy="429" r="1.5" fill="#0E6B3A"/><circle cx="980" cy="429" r="1.5" fill="#0E6B3A"/>
  </g>

  <!-- UŻYTKOWNIK: three legible, distinct thinking steps. -->
  <g>
    <rect x="76" y="494" width="300" height="104" rx="16" fill="#F8FCF8" stroke="#D7EADD"/>
    <circle cx="101" cy="520" r="10" fill="#0E6B3A"/><path d="M97 520H105M101 516V524" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="124" y="526" class="section-title">CEL I KONTEKST</text>
    <text x="100" y="565" class="section-body">Co chcę osiągnąć?</text>
    <rect x="76" y="618" width="300" height="104" rx="16" fill="#F8FCF8" stroke="#D7EADD"/>
    <circle cx="101" cy="644" r="10" fill="#0E6B3A"/><path d="M96 646L100 650L107 640" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="124" y="650" class="section-title">OCENA I INTERPRETACJA</text>
    <text x="100" y="689" class="section-body">Co jest istotne?</text>
    <rect x="76" y="742" width="300" height="116" rx="16" fill="#F8FCF8" stroke="#D7EADD"/>
    <circle cx="101" cy="768" r="10" fill="#0E6B3A"/><path d="M96 768H106M101 763V773" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="124" y="774" class="section-title">ŚWIADOMY WYBÓR</text>
    <text x="100" y="810" class="section-body">Decyzja i odpowiedzialność</text>
    <text x="100" y="834" class="section-body">po mojej stronie.</text>
  </g>

  <!-- AI: three legible, distinct inputs rather than a control panel. -->
  <g>
    <rect x="704" y="494" width="300" height="104" rx="16" fill="#F8FCF9" stroke="#D2E7DB"/>
    <circle cx="729" cy="520" r="10" fill="#0E6B3A"/><path d="M725 520H733M729 516V524" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="752" y="526" class="section-title">KIERUNKI</text>
    <text x="728" y="565" class="section-body">Możliwe opcje i scenariusze.</text>
    <rect x="704" y="618" width="300" height="104" rx="16" fill="#F8FCF9" stroke="#D2E7DB"/>
    <circle cx="729" cy="644" r="10" fill="#0E6B3A"/><path d="M729 638V646M729 650V650" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <text x="752" y="650" class="section-title">KONSEKWENCJE</text>
    <text x="728" y="689" class="section-body">Potencjalne skutki i ryzyka.</text>
    <rect x="704" y="742" width="300" height="116" rx="16" fill="#F8FCF9" stroke="#D2E7DB"/>
    <circle cx="729" cy="768" r="10" fill="#0E6B3A"/><path d="M729 763V770M729 774V774" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <text x="752" y="774" class="section-title">LUKI W WIEDZY</text>
    <text x="728" y="810" class="section-body">Czego jeszcze nie wiemy?</text>
  </g>

  <!-- Shared, central zone: incoming information is analysed; the decision stays visible and human-owned. -->
  <g filter="url(#shadow)">
    <rect x="422" y="418" width="236" height="432" rx="30" fill="url(#shared)" stroke="#8CC69B" stroke-width="2"/>
  </g>
  <path d="M398 546H422M398 546L411 535M398 546L411 557" fill="none" stroke="#26913F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M682 546H658M682 546L669 535M682 546L669 557" fill="none" stroke="#26913F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M398 726H422M398 726L411 715M398 726L411 737" fill="none" stroke="#26913F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M682 726H658M682 726L669 715M682 726L669 737" fill="none" stroke="#26913F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="540" y="475" text-anchor="middle" class="label">WSPÓLNA STREFA</text>
  <text x="540" y="525" text-anchor="middle" class="sans ink" font-size="24" font-weight="700" letter-spacing="1.7">ANALIZA</text>
  <g fill="none" stroke="#0E6B3A" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="524" cy="576" r="25" stroke-width="5"/>
    <path d="M542 594L562 614" stroke-width="6"/>
    <path d="M509 578L520 567L529 576L541 561" stroke-width="4"/>
  </g>
  <path d="M454 643H626" stroke="#9DCEA8" stroke-width="2"/>
  <text x="540" y="694" text-anchor="middle" class="sans ink" font-size="24" font-weight="700" letter-spacing="1.7">DECYZJA</text>
  <circle cx="540" cy="752" r="31" fill="#0E6B3A"/>
  <path d="M524 752L535 763L558 740" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="540" y="805" text-anchor="middle" class="sans muted" font-size="15" font-weight="700">po stronie użytkownika</text>

  <path d="M72 937H1008" stroke="#BCD9C2" stroke-width="2"/>
  <text x="540" y="1004" text-anchor="middle" class="sans ink" font-size="27" font-weight="700" letter-spacing=".2">Praktycznie. Świadomie. Bez skrótów.</text>
</svg>
